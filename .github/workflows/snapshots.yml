name: Snapshots

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types:
      - completed

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}


      - name: Skip bot-triggered runs
        if: github.actor == 'github-actions[bot]'
        run: exit 0
      
      - name: Get draft release version
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draft = releases.data.find(r => r.draft === true);

            if (!draft) {
              core.setFailed("No draft release found");
              return;
            }

            const version = draft.tag_name.replace(/^v/, "");
            core.setOutput("version", version);
      
      - name: Update pom versions
        run: |
          VERSION="${{ steps.draft.outputs.version }}-SNAPSHOT"
          echo "Setting version to $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Set Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@bots.noreply.github.com"

      - name: Commit updated pom versions
        run: |
          if git diff --quiet; then
            echo "No version changes, skipping commit"
            exit 0
          fi
          
          git commit -am "chore: sync pom versions with release draft"

          git push