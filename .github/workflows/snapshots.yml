name: Snapshots

on:
  workflow_run:
    workflows: ["Release Drafter"]
    types:
      - completed

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip bot-triggered runs
        if: github.actor == 'github-actions[bot]'
        run: exit 0
      
      - name: Get draft release version
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const draft = releases.data.find(r => r.draft === true);

            if (!draft) {
              core.setFailed("No draft release found");
              return;
            }

            const version = draft.tag_name.replace(/^v/, "");
            core.setOutput("version", version);
      
      - name: Update pom versions
        run: |
          VERSION="${{ steps.draft.outputs.version }}-SNAPSHOT"
          echo "Setting version to $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
      
      - name: Commit updated pom versions
        run: |
          if git diff --quiet; then
            echo "No version changes, skipping commit"
            exit 0
          fi
          
          git commit -am "chore: sync pom versions with release draft"

          # Push using COMMIT_PAT (token in Mada's ownership) as GITHUB_TOKEN is not usable as I can't find a way to allow gh actions to bypass branch ruleset
          git push https://x-access-token:${{ secrets.COMMIT_PAT }}@github.com/${{ github.repository }} HEAD:main