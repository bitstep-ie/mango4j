name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm execution"
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.drafter.outputs.body }}
      tag: ${{ steps.drafter.outputs.tag_name }}
    steps:
      - uses: release-drafter/release-drafter@v6
        id: drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  use-draft:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Tag: ${{ needs.draft.outputs.tag }}"
          echo "Release Notes:"
          echo "${{ needs.draft.outputs.body }}"

  run:
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install docs dependencies
        working-directory: documentation
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      

      - name: Fetch gh-pages
        run: git fetch origin gh-pages:gh-pages || echo "No gh-pages branch yet"

      - name: Release Version Deploy
        working-directory: documentation
#        if: ${{ github.event.release && github.event.release.tag_name != '' }}
        run: |
          MANGO4J_LATEST_VERSION=0.1.0 \
          mike deploy 0.1.0 latest -u --push
# mike deploy ${{ github.event.release.tag_name }} latest -u --push

      - name: Default latest
        working-directory: documentation
        run: mike set-default latest --allow-undefined --push
