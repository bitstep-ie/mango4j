name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to confirm execution"
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.drafter.outputs.body }}
      tag: ${{ steps.drafter.outputs.tag_name }}
      name: ${{steps.drafter.outputs.name}}
    steps:
      - uses: release-drafter/release-drafter@v6
        id: drafter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  run:
    needs: draft
    if: ${{ github.event.inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print data
        run: |
          echo "Tag: ${{ needs.draft.outputs.tag }}"
          echo "Release Notes:"
          echo "${{ needs.draft.outputs.body }}"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install docs dependencies
        working-directory: documentation
        run: pip install -r requirements.txt

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Update pom versions
        run: |
          TAG="${{needs.draft.outputs.tag}}"
          VERSION="${TAG#v}"
          echo "Setting version to $VERSION"
          mvn -B -q versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Commit updated pom versions
        run: |
          if git diff --quiet; then
            echo "No version changes, skipping commit"
            exit 0
          fi
          
          git commit -am "chore: sync pom versions with release"
          git tag -a "$TAG" -m "Release $TAG"

          git push
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.draft.outputs.tag }}
          name: ${{ needs.draft.outputs.name }}
          body: ${{ needs.draft.outputs.body }}
          draft: false
          prerelease: false

      - name: Fetch gh-pages
        run: git fetch origin gh-pages:gh-pages || echo "No gh-pages branch yet"

      - name: Release Version Deploy
        working-directory: documentation
        run: |
          MANGO4J_LATEST_VERSION=${{ replace(needs.draft.outputs.tag, 'v', '') }} \
          mike deploy ${{ replace(needs.draft.outputs.tag, 'v', '') }} latest -u --push

      - name: Default latest
        working-directory: documentation
        run: mike set-default latest --allow-undefined --push
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish Snapshot
        if: github.ref == 'refs/heads/main'
        run: mvn -B deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      
